<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0f1419"/>
<meta name="color-scheme" content="dark light"/>
<title>Bilimport v1.4.0</title>
<style>
:root{
  --bg:#0f1419;--card:#1a2332;--border:#2d3a4f;--text:#e8eef6;--muted:#8b9bb4;
  --accent:#3b82f6;--ok:#34d399;--warn:#fbbf24;--err:#f87171;
  --tap:52px;--font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media(prefers-color-scheme:light){
  :root{--bg:#f4f6f9;--card:#fff;--border:#d0d8e4;--text:#0f172a;--muted:#64748b;
    --accent:#2563eb;--ok:#059669;--warn:#b45309;--err:#dc2626}
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;-webkit-text-size-adjust:100%}
.app{max-width:440px;margin:0 auto;padding:1rem 1rem 3rem}
h1{font-size:1.35rem;margin:0 0 .2rem;font-weight:700}
p.lead{color:var(--muted);margin:0 0 1rem;font-size:.9rem;line-height:1.35}.ver{font-size:.75rem;color:var(--muted);margin:.15rem 0 0;font-weight:500;font-variant-numeric:tabular-nums}.ver code{font-size:.7rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:.85rem}
label{display:block;font-size:.78rem;color:var(--muted);margin:0 0 .35rem;font-weight:600}
textarea,input,select{
  width:100%;padding:.75rem .9rem;font-size:1.05rem;border-radius:10px;
  border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit
}
textarea{min-height:7.5rem;resize:vertical;line-height:1.35}
input,select{min-height:var(--tap)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.field{margin-bottom:.75rem}.field:last-child{margin-bottom:0}
.check{display:flex;align-items:center;gap:.7rem;min-height:var(--tap);font-size:.92rem}
.check input{width:1.35rem;height:1.35rem;accent-color:var(--accent);min-height:0}
.btn{
  width:100%;min-height:var(--tap);border:none;border-radius:12px;font-size:1.1rem;font-weight:700;
  background:var(--accent);color:#fff;cursor:pointer;font-family:inherit
}
.btn:disabled{opacity:.55;cursor:wait}
.btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border);font-weight:600;font-size:.95rem;margin-top:.6rem}
.status{font-size:.85rem;margin-top:.65rem;line-height:1.35;color:var(--muted);min-height:1.2em}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.error{color:var(--err)}
.row{display:flex;justify-content:space-between;gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--border);font-size:.95rem}
.row:last-child{border-bottom:none}
.row span:last-child{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.total{margin-top:.55rem;padding:.9rem;border-radius:12px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);display:flex;justify-content:space-between;align-items:baseline;gap:.75rem}
.total b{color:var(--ok);font-size:1.4rem;font-variant-numeric:tabular-nums}
.note{font-size:.75rem;color:var(--muted);margin-top:.7rem;line-height:1.4}
details.manual{margin-top:.25rem}
details.manual>summary{cursor:pointer;color:var(--muted);font-size:.9rem;font-weight:600;padding:.4rem 0;list-style:none}
details.manual>summary::-webkit-details-marker{display:none}
details.manual>summary::before{content:"▸ ";}
details.manual[open]>summary::before{content:"▾ ";}
.hidden{display:none!important}
.meta{font-size:.85rem;color:var(--muted);margin:0 0 .75rem;line-height:1.35}
.meta strong{color:var(--text)}
</style>
</head>
<body>
<div class="app">
  <h1>Bilimport</h1>
  <p class="ver" id="appVer">v1.4.0 · 380f7a7 · godtar id fra 6 siffer (share-lenker)</p>
  <p class="lead">Lim inn mobile.de-lenke eller dele-tekst → Beregn norsk ca.-pris (2026).</p>

  <div class="card">
    <label for="paste">Lim inn lenke / dele-tekst</label>
    <textarea id="paste" placeholder="https://suchen.mobile.de/...id=…&#10;eller hele dele-teksten fra appen" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <button type="button" class="btn" id="btnCalc" style="margin-top:.75rem">Beregn</button>
    <p class="status" id="status"></p>
  </div>

  <div class="card hidden" id="resultCard">
    <p class="meta" id="listingMeta"></p>
    <div class="row"><span>Kjøp (netto NOK)</span><span id="rKjop">–</span></div>
    <div class="row"><span>Frakt</span><span id="rFrakt">–</span></div>
    <div class="row"><span>MVA 25 %</span><span id="rMva">–</span></div>
    <div class="row"><span>Engangsavgift</span><span id="rEng">–</span></div>
    <div class="row"><span>Vrakpant</span><span id="rVrak">–</span></div>
    <div class="total"><span>Totalt ca.</span><b id="rTotal">–</b></div>
    <p class="note" id="notes"></p>
    <p class="note">Estimat – ikke Skatteetaten-vedtak. Preferer Leergewicht.</p>
  </div>

  <details class="card manual hidden" id="manualWrap">
    <summary>Korriger felter</summary>
    <div style="margin-top:.75rem">
      <div class="field"><label for="price">Pris (EUR)</label><input id="price" type="number" inputmode="decimal" min="0"/></div>
      <label class="check"><input id="mwst" type="checkbox"/><span>MwSt ausweisbar (÷ 1,19)</span></label>
      <div class="grid" style="margin-top:.75rem">
        <div class="field"><label for="rate">EUR/NOK</label><input id="rate" type="number" step="0.01" value="11.5"/></div>
        <div class="field"><label for="freight">Frakt (NOK)</label><input id="freight" type="number" value="8000"/></div>
      </div>
      <div class="grid">
        <div class="field"><label for="first">Første reg.</label><input id="first" type="month"/></div>
        <div class="field"><label for="noreg">Reg. i Norge</label><input id="noreg" type="month"/></div>
      </div>
      <div class="grid">
        <div class="field"><label for="weight">Egenvekt (kg)</label><input id="weight" type="number" inputmode="numeric"/></div>
        <div class="field"><label for="co2">CO₂ (g/km)</label><input id="co2" type="number" inputmode="numeric" placeholder="mangler → estimat"/></div>
      </div>
      <div class="field"><label for="km">Km</label><input id="km" type="number" inputmode="numeric"/></div>
      <div class="field"><label for="fuel">Drivstoff</label>
        <select id="fuel">
          <option value="bensin">Bensin</option>
          <option value="diesel">Diesel</option>
          <option value="hybrid">Hybrid</option>
          <option value="el">El</option>
        </select>
      </div>
      <button type="button" class="btn secondary" id="btnRecalc">Oppdater beregning</button>
    </div>
  </details>
</div>
<script>
(function () {
  "use strict";

  /**
   * PROXY_BASE: Cloudflare Worker or Apps Script /exec URL.
   * Empty = try corsproxy.org then direct translate.goog (CORS often fails on Pages).
   */
  const APP_VERSION = 'v1.4.0';
  const APP_BUILD = '380f7a7';
  const APP_NOTE = 'godtar id fra 6 siffer (share-lenker)';
  const PROXY_BASE = 'https://script.google.com/macros/s/AKfycbykx0huOEwyX_jziQWgBXNo-vlRY7CgmOZpasIxvN5RlJwm9y-uMScoqjEuoWzkHz4/exec';

  const VRAK = 2400, MWST = 0.19, MVA = 0.25;
  const BRUKS = [
    [1,2],[2,4],[3,6],[4,8],[5,10],[6,12],[7,14],[8,15],[9,16],[10,17],[11,18],[12,19],
    [14,20],[16,21],[18,22],[20,23],[22,24],[24,26],[30,30],[36,33],[42,37],[48,40],
    [54,44],[60,50],[66,54],[72,58],[78,62],[84,66],[90,70],[96,74],[102,78],[108,82],
    [120,90],[132,91],[144,92],[156,93],[168,94],[180,95],[192,96],[216,98],[240,100]
  ];

  const $ = (id) => document.getElementById(id);

  function todayMonth() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }

  function fmt(n) {
    if (!Number.isFinite(n)) return "–";
    return new Intl.NumberFormat("nb-NO", {
      style: "currency", currency: "NOK", maximumFractionDigits: 0
    }).format(Math.round(n));
  }

  function monthsBetween(a, b) {
    if (!a || !b) return 0;
    const [ay, am] = a.split("-").map(Number);
    const [by, bm] = b.split("-").map(Number);
    return Math.max(0, (by - ay) * 12 + (bm - am));
  }

  function bruks(m) {
    let p = 0;
    for (const [t, v] of BRUKS) {
      if (m >= t) p = v; else break;
    }
    return p;
  }

  function co2Tax(c) {
    if (!(c > 0)) return 0;
    let t = 0, prev = 0;
    for (const [up, rate] of [[100, 800], [150, 1600], [225, 3200], [1e9, 5000]]) {
      if (c <= prev) break;
      t += (Math.min(c, up) - prev) * rate;
      prev = up;
    }
    return t;
  }

  function deNum(s) {
    if (s == null || s === "") return null;
    s = String(s).replace(/\u00a0/g, " ").replace(/&nbsp;/g, " ").replace(/[^\d.,]/g, "");
    if (!s) return null;
    if (/^\d{1,3}(\.\d{3})+$/.test(s)) return parseInt(s.replace(/\./g, ""), 10);
    if (s.includes(",") && s.includes(".")) return Math.round(parseFloat(s.replace(/\./g, "").replace(",", ".")));
    if (s.includes(",")) return Math.round(parseFloat(s.replace(",", ".")));
    const n = parseFloat(s);
    return Number.isFinite(n) ? Math.round(n) : null;
  }

  function parseGermanDate(s) {
    s = String(s || "").trim();
    let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
    if (m) return m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
    m = s.match(/^(\d{1,2})[./](\d{4})$/);
    if (m) return m[2] + "-" + m[1].padStart(2, "0");
    return null;
  }

  function toMonthInput(isoOrYm) {
    if (!isoOrYm) return "";
    return String(isoOrYm).slice(0, 7);
  }

  function normFuel(raw) {
    if (!raw) return null;
    const t = String(raw).toLowerCase();
    if (/elektro|electric|strom|\bev\b/.test(t)) return "el";
    if (/hybrid|plugin|plug-in|plug in/.test(t)) return "hybrid";
    if (/diesel/.test(t)) return "diesel";
    if (/benzin|petrol|gasoline|bensin/.test(t)) return "bensin";
    return null;
  }

  function extractListingId(text) {
    const m = String(text || "").match(/[?&]id=(\d{6,})/i) ||
      String(text || "").match(/\/(\d{6,})(?:\.html)?(?:[?#]|$)/);
    return m ? m[1] : null;
  }

  function extractMobileUrl(text) {
    const m = String(text || "").match(/https?:\/\/(?:m\.|www\.|suchen\.)?mobile\.de\/[^\s<>"']+/i);
    if (!m) return null;
    return m[0].replace(/[),.]+$/, "");
  }

  function translateUrl(id) {
    return "https://suchen-mobile-de.translate.goog/fahrzeuge/details.html?id=" +
      encodeURIComponent(id) + "&_x_tr_sl=de&_x_tr_tl=en&_x_tr_hl=en";
  }

  /** Same logic as parse_test.py */
  function parseListingHtml(html) {
    html = String(html).replace(/\u00a0/g, " ").replace(/&nbsp;/g, " ");
    const notes = [];
    const out = {
      ok: true, id: null, priceEur: null, inclMwst: null, firstReg: null,
      km: null, weightKg: null, co2: null, fuel: null, title: null, notes
    };

    let m = html.match(/\\"id\\"\s*:\s*(\d{6,})/) || html.match(/"id"\s*:\s*(\d{6,})/) ||
      html.match(/[?&]id=(\d{6,})/);
    if (m) out.id = m[1];

    m = html.match(/\\"price\\"\s*:\s*\{\s*\\"grs\\"\s*:\s*\{\s*\\"amount\\"\s*:\s*(\d+)/) ||
      html.match(/"price"\s*:\s*\{\s*"grs"\s*:\s*\{\s*"amount"\s*:\s*(\d+)/);
    if (m) { out.priceEur = +m[1]; notes.push("pris fra listing.price.grs"); }

    const noVat = /Differenzbesteuerung|MwSt\.?\s*nicht\s*ausweisbar|§\s*25a/i.test(html);
    const withVat = /\\"vat\\"\s*:\s*19\b|"vat"\s*:\s*19\b|19\s*%\s*MwSt|MwSt\.?\s*ausweisbar|€\s*Netto/i.test(html);
    if (noVat) { out.inclMwst = false; notes.push("Differenzbesteuerung"); }
    else if (withVat) { out.inclMwst = true; notes.push("MwSt ausweisbar"); }

    const attrs = {};
    const attrRe = /\\"tag\\"\s*:\s*\\"([^\\]+)\\"\s*,\s*\\"value\\"\s*:\s*\\"([^\\]*)\\"/g;
    let am;
    while ((am = attrRe.exec(html))) {
      if (!(am[1] in attrs)) attrs[am[1]] = am[2].replace(/\\u00a0/g, " ").replace(/\\xa0/g, " ");
    }

    if (attrs.mileage) out.km = deNum(attrs.mileage);
    if (attrs.firstRegistration) out.firstReg = parseGermanDate(attrs.firstRegistration);

    let leer = null;
    for (const key of ["curbWeight", "emptyWeight", "leergewicht"]) {
      if (attrs[key]) { leer = deNum(attrs[key]); break; }
    }
    m = html.match(/Leergewicht[\s\S]{0,60}?([\d.]+)\s*kg/i);
    if (m) leer = deNum(m[1]);
    if (leer != null) { out.weightKg = leer; notes.push("vekt Leergewicht"); }
    else if (attrs.netWeight) { out.weightKg = deNum(attrs.netWeight); notes.push("vekt Gewicht/netWeight"); }

    if (attrs.fuel) out.fuel = normFuel(attrs.fuel);
    for (const key of ["co2", "co2Emission", "envkv.co2", "combinedCO2", "envkv.emission"]) {
      if (attrs[key]) {
        const n = deNum(attrs[key]);
        if (n && n >= 20 && n <= 500) out.co2 = n;
        break;
      }
    }

    m = html.match(/\\"title\\"\s*:\s*\\"([^\\]*)\\"/);
    if (m) out.title = m[1].slice(0, 120);
    if (!out.title) {
      m = html.match(/<title>([^<]+)<\/title>/i);
      if (m) out.title = m[1].replace(/\s+für\s+[\d.]+\s*€.*/i, "").trim().slice(0, 120);
    }

    if (out.priceEur == null) {
      m = html.match(/data-testid="vip-price-label"[^>]*>[\s\S]*?>\s*([\d.]+)\s*€/i) ||
        html.match(/<title>[^<]*?für\s+([\d.]+)\s*€/i);
      if (m) { out.priceEur = deNum(m[1]); notes.push("pris fra HTML"); }
    }
    if (out.km == null) {
      m = html.match(/data-testid="vip-key-features-list-item-mileage"[\s\S]{0,500}?<h4[^>]*>\s*([\d.]+)\s*km/i) ||
        html.match(/Kilometerstand[\s\S]{0,120}?([\d.]+)\s*km/i);
      if (m) out.km = deNum(m[1]);
    }
    if (!out.firstReg) {
      m = html.match(/data-testid="vip-key-features-list-item-firstRegistration"[\s\S]{0,500}?<h4[^>]*>\s*(\d{1,2}\/\d{4})/i) ||
        html.match(/Erstzulassung[\s\S]{0,120}?(\d{1,2}[./]\d{4})/i);
      if (m) out.firstReg = parseGermanDate(m[1]);
    }
    if (out.weightKg == null) {
      m = html.match(/data-testid="netWeight-item"[\s\S]{0,160}?([\d.]+)\s*kg/i) ||
        html.match(/>\s*Gewicht\s*<[\s\S]{0,80}?([\d.]+)\s*kg/i);
      if (m) out.weightKg = deNum(m[1]);
    }
    if (out.co2 == null) {
      const re = /(\d{2,3})\s*g\s*\/\s*km/gi;
      let cm;
      while ((cm = re.exec(html))) {
        const n = +cm[1];
        if (n >= 20 && n <= 500) { out.co2 = n; break; }
      }
    }
    if (!out.fuel) {
      m = html.match(/data-testid="vip-key-features-list-item-fuel"[\s\S]{0,600}?<h4[^>]*>\s*([^<]+)/i) ||
        html.match(/data-testid="fuel-item"[\s\S]{0,160}?<dd[^>]*>\s*([^<]+)/i);
      if (m) out.fuel = normFuel(m[1]);
    }
    if (out.inclMwst == null && out.priceEur != null) notes.push("MwSt ukjent");
    return out;
  }

  function coerceFuel(fuel, title, weight, co2) {
    let f = fuel || "bensin";
    const t = String(title || "");
    if (f === "el" && /\b(Benzin|AMG|G\s*63|Biturbo|CGI|TSI|TFSI|Petrol)\b/i.test(t)) f = "bensin";
    if (f === "el" && /\bDiesel\b/i.test(t) && !/Hybrid/i.test(t)) f = "diesel";
    // Proxy often false-El when page mentions Elektro elsewhere; heavy cars without CO2/EQ title → ICE
    if (f === "el" && (weight || 0) >= 2000 && !(co2 > 0) && !/\b(EQ|Electric|Elektro|Strom|EV)\b/i.test(t)) {
      f = "bensin";
    }
    return f;
  }

  function applyListing(data) {
    if (data.priceEur != null) $("price").value = data.priceEur;
    if (data.inclMwst != null) $("mwst").checked = !!data.inclMwst;
    if (data.firstReg) $("first").value = toMonthInput(data.firstReg);
    if (data.weightKg != null) $("weight").value = data.weightKg;
    if (data.co2 != null) $("co2").value = data.co2;
    if (data.km != null) $("km").value = data.km;
    if (data.fuel) $("fuel").value = coerceFuel(data.fuel, data.title, data.weightKg, data.co2);
  }

  function calculate() {
    const price = +($("price").value) || 0;
    const rate = +($("rate").value) || 11.5;
    const freight = +($("freight").value) || 0;
    const weight = +($("weight").value) || 0;
    let co2 = +($("co2").value);
    const fuel = $("fuel").value;
    const notes = [];

    let net = price;
    if ($("mwst").checked && price > 0) {
      net = price / (1 + MWST);
      notes.push("MwSt 19 % trukket");
    } else if (price > 0) {
      notes.push("Pris som netto (Differenz / uten MwSt)");
    }

    const kjop = net * rate;
    const mva = (kjop + freight) * MVA;

    let co2Used = co2, co2Est = false;
    if (!(co2 > 0) && fuel !== "el" && weight > 0) {
      co2Used = weight / 10;
      co2Est = true;
      notes.push("CO₂ estimert egenvekt/10 (" + co2Used.toFixed(0) + ")");
    }

    const s2 = Math.max(0, weight - 500) * 12.71;
    let s3w = 0, s3c = 0;
    if (fuel === "el") {
      notes.push("El: kun §2");
    } else {
      s3w = Math.max(0, weight - 1200) * 260;
      s3c = co2Tax(co2Used || 0);
    }
    const eng = s2 + s3w + s3c;
    const m = monthsBetween($("first").value, $("noreg").value);
    const pct = bruks(m);
    const engE = eng * (1 - pct / 100);
    if ($("first").value) notes.push("Bruksfradrag " + pct + " % (" + m + " mnd)");
    else notes.push("Ingen EZ → bruksfradrag 0 %");

    const total = kjop + freight + mva + engE + VRAK;
    $("rKjop").textContent = fmt(kjop);
    $("rFrakt").textContent = fmt(freight);
    $("rMva").textContent = fmt(mva);
    $("rEng").textContent = fmt(engE);
    $("rVrak").textContent = fmt(VRAK);
    $("rTotal").textContent = fmt(total);
    $("notes").textContent = notes.join(" · ");
    return { total, co2Est };
  }

  function setStatus(cls, msg) {
    const el = $("status");
    el.className = "status" + (cls ? " " + cls : "");
    el.textContent = msg || "";
  }

  function parseListingText(text) {
    const found = {
      ok: true, id: null, priceEur: null, inclMwst: null, firstReg: null,
      km: null, weightKg: null, co2: null, fuel: null, title: null, notes: []
    };
    const raw = String(text || "").replace(/\u00a0/g, " ");

    const mobileUrl = extractMobileUrl(raw);
    found.id = extractListingId(raw) || (mobileUrl && extractListingId(mobileUrl)) || null;

    let m = raw.match(/(?:€\s*|EUR\s*)(\d{1,3}(?:[.\s]\d{3})+|\d+)(?:[,\.]\d+)?/i) ||
      raw.match(/(\d{1,3}(?:[.\s]\d{3})+|\d+)(?:[,\.]\d+)?\s*(?:€|EUR)/i);
    if (m) found.priceEur = parseInt(m[1].replace(/[.\s]/g, ""), 10);

    m = raw.match(/(?:Erstzulassung|EZ|1\.\s*Zulassung|Første\s*reg)[:\s]*(\d{1,2}[./]\d{1,2}[./]\d{4}|\d{1,2}[./]\d{4})/i);
    if (m) found.firstReg = parseGermanDate(m[1]);
    else {
      m = raw.match(/\b(\d{2}\.\d{2}\.\d{4})\b/);
      if (m) found.firstReg = parseGermanDate(m[1]);
    }

    m = raw.match(/(\d{1,3}(?:[.\s]\d{3})+|\d+)\s*km\b/i);
    if (m) found.km = parseInt(m[1].replace(/[.\s]/g, ""), 10);

    m = raw.match(/(\d{2,3})\s*g\s*\/?\s*km/i) || raw.match(/CO\s*[₂2]\s*[:\s]*(\d{1,3})/i);
    if (m) found.co2 = parseInt(m[1], 10);

    m = raw.match(/(?:Leergewicht|Eigengewicht|Egenvekt|Gewicht)[:\s]*(\d{3,4})\s*kg/i) ||
      raw.match(/(\d{3,4})\s*kg\b/i);
    if (m) found.weightKg = parseInt(m[1], 10);

    if (/\b(Elektro|Electric|Elbil|Strom)\b/i.test(raw)) found.fuel = "el";
    else if (/\b(Hybrid|Plugin|Plug-in)\b/i.test(raw)) found.fuel = "hybrid";
    else if (/\b(Diesel)\b/i.test(raw)) found.fuel = "diesel";
    else if (/\b(Benzin|Petrol|Gasoline|Bensin)\b/i.test(raw)) found.fuel = "bensin";

    const noVat = /Differenzbesteuerung|MwSt\.?\s*nicht\s*ausweisbar|§\s*25a/i.test(raw);
    const withVat = /MwSt\.?\s*ausweisbar|inkl\.?\s*(?:19\s*%\s*)?MwSt|VAT\s*deductible/i.test(raw);
    if (noVat) found.inclMwst = false;
    else if (withVat) found.inclMwst = true;

    const lines = raw.split(/\n/).map((l) => l.trim()).filter(Boolean);
    if (lines.length) {
      const titleLine = lines.find((l) =>
        /[A-Za-z]{2,}/.test(l) && !/^https?:/.test(l) && l.length < 120
      );
      if (titleLine) found.title = titleLine.slice(0, 100);
    }
    return found;
  }

  function listingHasFields(data) {
    if (!data) return false;
    return data.priceEur != null || data.weightKg != null || data.firstReg ||
      data.km != null || data.co2 != null || data.fuel || data.inclMwst != null;
  }

  function fetchViaProxyJsonp(id) {
    return new Promise((resolve, reject) => {
      const base = PROXY_BASE.replace(/\/$/, "");
      const cbName = "bilimportCb_" + Math.random().toString(36).slice(2, 10);
      const script = document.createElement("script");
      let settled = false;
      const cleanup = () => {
        try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      };
      const timer = setTimeout(() => {
        if (settled) return;
        settled = true;
        cleanup();
        reject(new Error("JSONP timeout (25s)"));
      }, 25000);
      window[cbName] = (data) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        cleanup();
        if (!data || data.ok === false) {
          reject(new Error((data && data.error) || "Proxy JSONP feilet"));
          return;
        }
        resolve(data);
      };
      script.onerror = () => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        cleanup();
        reject(new Error("JSONP script load failed"));
      };
      const qs = "?id=" + encodeURIComponent(id) + "&callback=" + encodeURIComponent(cbName);
      script.src = base + qs;
      document.head.appendChild(script);
    });
  }

  async function fetchViaProxyJson(id, mobileUrl) {
    const base = PROXY_BASE.replace(/\/$/, "");
    const qs = id ? ("?id=" + encodeURIComponent(id)) :
      ("?url=" + encodeURIComponent(mobileUrl));
    const res = await fetch(base + qs, { credentials: "omit" });
    if (!res.ok) throw new Error("Proxy HTTP " + res.status);
    const data = await res.json();
    if (!data || data.ok === false) throw new Error((data && data.error) || "Proxy feilet");
    return data;
  }

  async function fetchViaProxy(id, mobileUrl) {
    const base = PROXY_BASE || "";
    if (/script\.google\.com/i.test(base)) {
      const listingId = id || extractListingId(mobileUrl);
      if (!listingId) throw new Error("Mangler listing-id for JSONP");
      return fetchViaProxyJsonp(listingId);
    }
    return fetchViaProxyJson(id, mobileUrl);
  }

  async function fetchListingHtml(id) {
    const tg = translateUrl(id);
    const attempts = [];
    attempts.push({ name: "corsproxy.org", url: "https://corsproxy.org/?" + encodeURIComponent(tg) });
    attempts.push({ name: "direct", url: tg });

    let lastErr = null;
    for (const a of attempts) {
      try {
        const res = await fetch(a.url, { credentials: "omit" });
        if (!res.ok) { lastErr = new Error(a.name + " HTTP " + res.status); continue; }
        const text = await res.text();
        if (text.length < 2000 || !/mobile\.de|fahrzeuge|vip-price|price/i.test(text)) {
          lastErr = new Error(a.name + ": ugyldig svar");
          continue;
        }
        return text;
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error("Kunne ikke hente annonse");
  }

  async function fetchListingData(id, mobileUrl) {
    const listingId = id || extractListingId(mobileUrl);
    if (PROXY_BASE) {
      return fetchViaProxy(id, mobileUrl);
    }
    if (!listingId) throw new Error("Mangler listing-id");
    const html = await fetchListingHtml(listingId);
    const data = parseListingHtml(html);
    data.id = data.id || listingId;
    return data;
  }

  function showListingMeta(data) {
    const bits = [];
    if (data.title) bits.push("<strong>" + escapeHtml(data.title) + "</strong>");
    if (data.id) bits.push("id " + escapeHtml(data.id));
    if (data.km != null) bits.push(data.km.toLocaleString("nb-NO") + " km");
    $("listingMeta").innerHTML = bits.join(" · ");
  }

  function statusFromData(data, prefix) {
    const found = [];
    if (data.priceEur != null) found.push(data.priceEur + " €");
    if (data.inclMwst === true) found.push("MwSt ja");
    if (data.inclMwst === false) found.push("MwSt nei");
    if (data.firstReg) found.push("EZ " + data.firstReg);
    if (data.weightKg) found.push(data.weightKg + " kg");
    if (data.fuel) found.push(data.fuel);
    if (data.co2 == null) found.push("CO₂ mangler");
    return (prefix || "Fant: ") + found.join(", ");
  }

  async function beregn() {
    const text = $("paste").value.trim();
    if (!text) {
      setStatus("error", "Lim inn lenke eller dele-tekst først.");
      return;
    }

    const id = extractListingId(text);
    const mobileUrl = extractMobileUrl(text);
    if (!id && !mobileUrl) {
      setStatus("error", "Fant ingen mobile.de-id/lenke.");
      return;
    }

    $("btnCalc").disabled = true;
    setStatus("", "Henter annonse…");

    const pasteParsed = parseListingText(text);
    let fetchErr = null;
    let data = null;

    try {
      data = await fetchListingData(id, mobileUrl);
      if (data.priceEur == null && data.weightKg == null && !listingHasFields(data)) {
        throw new Error("Fant ikke pris/vekt i annonsen");
      }
    } catch (e) {
      fetchErr = e;
      data = null;
    }

    try {
      if (data && listingHasFields(data)) {
        applyListing(data);
      const paste = $("paste").value;
      if ($("fuel").value === "el") {
        if (/\bBenzin\b/i.test(paste) || /\bAMG\b/i.test(paste) || /G\s*63/i.test(paste)) $("fuel").value = "bensin";
        else if (/\bDiesel\b/i.test(paste)) $("fuel").value = "diesel";
      }
        $("manualWrap").classList.remove("hidden");
        $("resultCard").classList.remove("hidden");
        showListingMeta(data);
        calculate();
        setStatus("ok", statusFromData(data));
        return;
      }

      if (listingHasFields(pasteParsed)) {
        applyListing(pasteParsed);
        $("manualWrap").classList.remove("hidden");
        $("resultCard").classList.remove("hidden");
        showListingMeta(pasteParsed);
        calculate();
        const msg = fetchErr
          ? "Auto-hent feilet; brukte felter fra limt tekst. " + statusFromData(pasteParsed, "Fra tekst: ")
          : statusFromData(pasteParsed, "Fra limt tekst: ");
        setStatus("ok", msg);
        return;
      }

      // Only id (or nothing useful) — do not claim success
      $("manualWrap").classList.remove("hidden");
      $("resultCard").classList.remove("hidden");
      if (pasteParsed.id || id) {
        const onlyId = pasteParsed.id || id;
        $("listingMeta").innerHTML = "id " + escapeHtml(onlyId);
      }
      const why = fetchErr && fetchErr.message ? fetchErr.message : "ukjent feil";
      setStatus("error",
        "Auto-hent feilet (" + why + "). Kun listing-id funnet — fyll feltene manuelt. " +
        "Full auto-hent krever proxy (Worker/Apps Script) senere.");
    } finally {
      $("btnCalc").disabled = false;
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }

  $("noreg").value = todayMonth();
  $("btnCalc").addEventListener("click", beregn);
  $("btnRecalc").addEventListener("click", () => {
    calculate();
    setStatus("ok", "Oppdatert.");
  });
  ["price", "mwst", "rate", "freight", "first", "noreg", "weight", "co2", "fuel"].forEach((id) => {
    $(id).addEventListener("change", calculate);
  });
})();
</script>
