<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0f1419"/>
<title>Bilimport</title>
<style>
:root{--bg:#0f1419;--card:#1a2332;--border:#2d3a4f;--text:#e8eef6;--muted:#8b9bb4;--accent:#3b82f6;--ok:#34d399;--tap:52px;--font:system-ui,-apple-system,sans-serif}
@media(prefers-color-scheme:light){:root{--bg:#f4f6f9;--card:#fff;--border:#d0d8e4;--text:#0f172a;--muted:#64748b;--accent:#2563eb;--ok:#059669}}
*{box-sizing:border-box}body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh}
.app{max-width:420px;margin:0 auto;padding:1rem 1rem 2.5rem}
h1{font-size:1.4rem;margin:0 0 .25rem}p.lead{color:var(--muted);margin:0 0 1rem;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:.85rem}
label{display:block;font-size:.8rem;color:var(--muted);margin:0 0 .35rem;font-weight:600}
input,select{width:100%;min-height:var(--tap);padding:.7rem .9rem;font-size:1.05rem;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}.field{margin-bottom:.75rem}.field:last-child{margin-bottom:0}
.check{display:flex;align-items:center;gap:.7rem;min-height:var(--tap);font-size:.95rem}
.check input{width:1.4rem;height:1.4rem;accent-color:var(--accent)}
.row{display:flex;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid var(--border);font-size:.95rem}
.row:last-child{border-bottom:none}.row span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.total{margin-top:.5rem;padding:.9rem;border-radius:12px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.35);display:flex;justify-content:space-between;align-items:baseline}
.total b{color:var(--ok);font-size:1.45rem}
.note{font-size:.75rem;color:var(--muted);margin-top:.75rem;line-height:1.4}
</style>
</head>
<body>
<div class="app">
  <h1>Bilimport</h1>
  <p class="lead">Skriv inn tallene fra mobile.de. Du får ca. norsk pris.</p>

  <div class="card">
    <div class="field"><label for="price">Pris (EUR)</label><input id="price" type="number" inputmode="decimal" min="0" placeholder="f.eks. 25000"/></div>
    <label class="check"><input id="mwst" type="checkbox"/><span>Prisen inkluderer tysk MwSt 19 % (fradragsberettiget)</span></label>
    <div class="grid" style="margin-top:.75rem">
      <div class="field"><label for="rate">EUR/NOK</label><input id="rate" type="number" step="0.01" value="11.5"/></div>
      <div class="field"><label for="freight">Frakt (NOK)</label><input id="freight" type="number" value="8000"/></div>
    </div>
  </div>

  <div class="card">
    <div class="grid">
      <div class="field"><label for="first">Første reg. (utland)</label><input id="first" type="month"/></div>
      <div class="field"><label for="noreg">Reg. i Norge</label><input id="noreg" type="month"/></div>
    </div>
    <div class="grid">
      <div class="field"><label for="weight">Egenvekt (kg)</label><input id="weight" type="number" inputmode="numeric" placeholder="Leergewicht"/></div>
      <div class="field"><label for="co2">CO₂ (g/km)</label><input id="co2" type="number" inputmode="numeric" placeholder="WLTP"/></div>
    </div>
    <div class="field"><label for="fuel">Drivstoff</label>
      <select id="fuel"><option value="bensin">Bensin</option><option value="diesel">Diesel</option><option value="hybrid">Hybrid</option><option value="el">El</option></select>
    </div>
  </div>

  <div class="card" id="out">
    <div class="row"><span>Kjøp</span><span id="rKjop">–</span></div>
    <div class="row"><span>MVA 25 %</span><span id="rMva">–</span></div>
    <div class="row"><span>Engangsavgift</span><span id="rEng">–</span></div>
    <div class="row"><span>Vrakpant</span><span id="rVrak">–</span></div>
    <div class="total"><span>Totalt ca.</span><b id="rTotal">–</b></div>
    <p class="note" id="notes"></p>
    <p class="note">Estimat (2026-regler). Ikke Skatteetaten-vedtak. Bruk Leergewicht hvis du ser både Gewicht og Leergewicht.</p>
  </div>
</div>
<script>
(function(){
  const VRAK=2400, MWST=0.19, MVA=0.25;
  const BRUKS=[[1,2],[2,4],[3,6],[4,8],[5,10],[6,12],[7,14],[8,15],[9,16],[10,17],[11,18],[12,19],[14,20],[16,21],[18,22],[20,23],[22,24],[24,26],[30,30],[36,33],[42,37],[48,40],[54,44],[60,50],[66,54],[72,58],[78,62],[84,66],[90,70],[96,74],[102,78],[108,82],[120,90],[132,91],[144,92],[156,93],[168,94],[180,95],[192,96],[216,98],[240,100]];
  const $ = id => document.getElementById(id);
  function fmt(n){ if(!Number.isFinite(n)) return "–"; return new Intl.NumberFormat("nb-NO",{style:"currency",currency:"NOK",maximumFractionDigits:0}).format(Math.round(n)); }
  function monthsBetween(a,b){
    if(!a||!b) return 0;
    const [ay,am]=a.split("-").map(Number), [by,bm]=b.split("-").map(Number);
    return Math.max(0,(by-ay)*12+(bm-am));
  }
  function bruks(m){ let p=0; for(const [t,v] of BRUKS){ if(m>=t)p=v; else break;} return p; }
  function co2Tax(c){
    if(!(c>0)) return 0; let t=0,prev=0;
    for(const [up,rate] of [[100,800],[150,1600],[225,3200],[1e9,5000]]){
      if(c<=prev) break; t += (Math.min(c,up)-prev)*rate; prev=up;
    } return t;
  }
  function calc(){
    const price=+($("price").value)||0, rate=+($("rate").value)||11.5, freight=+($("freight").value)||0;
    const weight=+($("weight").value)||0; let co2=+($("co2").value); const fuel=$("fuel").value;
    const notes=[];
    let net=price; if($("mwst").checked && price>0){ net=price/1.19; notes.push("MwSt 19 % trukket"); }
    const kjop=net*rate, customs=kjop+freight, mva=customs*MVA;
    let co2Used=co2, co2Est=false;
    if(!(co2>0) && fuel!=="el" && weight>0){ co2Used=weight/10; co2Est=true; notes.push("CO₂ estimert egenvekt/10"); }
    const s2=Math.max(0,weight-500)*12.71;
    let s3w=0,s3c=0;
    if(fuel==="el"){ notes.push("El: kun vektavgift §2"); }
    else { s3w=Math.max(0,weight-1200)*260; s3c=co2Tax(co2Used||0); }
    const eng=s2+s3w+s3c;
    const m=monthsBetween($("first").value,$("noreg").value);
    const pct=bruks(m);
    const engE=eng*(1-pct/100);
    if($("first").value) notes.push("Bruksfradrag "+pct+" % ("+m+" mnd)");
    const total=kjop+freight+mva+engE+VRAK;
    $("rKjop").textContent=fmt(kjop); $("rMva").textContent=fmt(mva); $("rEng").textContent=fmt(engE); $("rVrak").textContent=fmt(VRAK); $("rTotal").textContent=fmt(total);
    $("notes").textContent=notes.join(" · ");
  }
  function todayMonth(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
  $("noreg").value=todayMonth();
  ["price","mwst","rate","freight","first","noreg","weight","co2","fuel"].forEach(id=>{
    $ (id).addEventListener("input",calc); $(id).addEventListener("change",calc);
  });
  calc();
})();
</script>
</body>
</html>
